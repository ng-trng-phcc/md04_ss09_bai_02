spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/pharmacy_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  branch-name: "Nha Thuoc So 1"
  hotline: "19001234"

server:
  port: 8085

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

pharmacy:
  vat-rate: 8

resilience4j:
  circuitbreaker:
    instances:
      warehouseCB:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        # converse từ properties:
        # resilience4j.circuitbreaker.instances.warehouseCB.failure-rate-threshold=50
        # resilience4j.circuitbreaker.instances.warehouseCB.wait-duration-in-open-state=20s
        sliding-window-size: 10
        sliding-window-type: count_based
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
